name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail:
        description: "Fail the run"
        type: boolean
        default: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploying ${{ github.sha }} from ${{ github.ref_name }}"
      - if: ${{ inputs.fail == true }}
        run: exit 1
